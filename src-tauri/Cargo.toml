[package]
name = "kalk"
version = "0.4.0"
description = "Kalk — 10 squats every 45 minutes. A tiny tray app for squat breaks."
authors = ["besinci"]
license = "MIT"
repository = "https://github.com/besinci/kalk"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows quirk,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "kalk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Mac App Store build: sandboxed, no self-updater, launch at login through
# SMAppService. See tauri.appstore.conf.json.
app-store = ["dep:objc2-service-management"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sys-locale = "0.3"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "ApplicationModel",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSound"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-service-management = { version = "0.3", optional = true }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
