name: Release

# Push a tag like v0.2.0 (matching the version in package.json, Cargo.toml and
# tauri.conf.json) to build both platforms into a draft GitHub release with
# the updater files. Review the draft, then publish it: installed copies of
# Kalk pick it up from releases/latest.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-targets: ""
            args: ""
          - os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Signing and notarization turn on once the Apple secrets exist; until
      # then the macOS build is unsigned, as before.
      - name: Apple signing setup
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple secrets: the macOS build will be unsigned."
            exit 0
          fi
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kalk ${{ github.ref_name }}
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          # Updater artifacts need the signing key, which only release builds
          # have; the regular Build workflow leaves them off.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      # The same kalk.exe as an MSIX, to upload to Partner Center by hand.
      - name: Microsoft Store package
        if: runner.os == 'Windows'
        run: node scripts/msix.mjs

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: kalk-msix
          path: src-tauri/target/msix/*.msix
          if-no-files-found: error
